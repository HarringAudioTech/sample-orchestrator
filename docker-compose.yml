services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - GH_PAT
    ports:
      - "8000:5001"
    volumes:
      - .:/app  # Map current directory to /app for live code reloading
      - ./data:/app/data  # Persist data in ./data directory on the host
    environment:
      - APP_ENV=development
      - APP_DEBUG=1
      - DATABASE_URL=sqlite:////app/data/orchestrator.db
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    
    # Command to start the application (init_db is handled by app lifespan)
    command: uvicorn src.app:app --host 0.0.0.0 --port 5001 --reload

secrets:
  GH_PAT:
    file: .env
