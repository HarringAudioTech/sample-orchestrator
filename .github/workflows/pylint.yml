name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POETRY_EXPERIMENTAL_SYSTEM_GIT_CLIENT: "true"
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        pip install poetry poetry-plugin-export
    - name: Install PortAudio system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libportaudiocpp0 portaudio19-dev
    - name: Install dependencies
      run: |
        poetry export --without-hashes --with dev -f requirements.txt > requirements.txt
        sed -i "s|https://github.com/|https://x-access-token:${GH_PAT}@github.com/|g" requirements.txt
        pip install -r requirements.txt
        pip install -e .
      env:
        GH_PAT: ${{ secrets.GH_PAT }}

    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
