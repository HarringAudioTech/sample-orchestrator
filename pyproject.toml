[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["google-labs-jules[bot] <161369871+google-labs-jules[bot]@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlmodel = "^0.0.16"
soundcard = "^0.4.3"
torch = "^2.11.0"
torchaudio = "^2.11.0"
jinja2 = "^3.1.3"
python-multipart = "^0.0.26"
librosa = "^0.11.0"
mido = "^1.3.3"
numpy = "^2.4.4"
requests = "^2.32.3"
pedalboard = "^0.9.22"
amanuensis = { git = "https://github.com/HarringAudioTech/amanuensis.git", tag = "v0.3" }
patchlab = { git = "https://github.com/HarringAudioTech/patchlab.git", tag = "v0.1", subdirectory = "patchlab-python" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pylint = ">=3.3.7,<4.0.0"
black = ">=26.3.1"
autopep8 = ">=2.3.2,<3.0.0"
pre-commit = "^4.2.0"
flake8 = "^7.2.0"
pytest-mock = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
