{% extends "base.html" %}

{% block title %}Create New Project - Orchestrator UI{% endblock %}

{% block content %}
<h2>Create New Sampling Project</h2>
<form action="{{ url_for('ui_bp.create_project_submit') }}" method="post">
    <div>
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required>
    </div>
    <div>
        <label for="project_description">Description:</label>
        <textarea id="project_description" name="project_description" rows="4"></textarea>
    </div>
    <div>
        <label for="config_file">Configuration File (Optional):</label>
        <input type="file" id="config_file" name="config_file">
    </div>
    <button type="submit">Create Project</button>
</form>
<p><em>(Form submission will be handled in a future task. For now, this is a visual placeholder.)</em></p>
{% endblock %}
