[build-system]
requires = [
    "uv>=0.9.21",
    "uv_build>=0.2.0",
]
build-backend = "uv_build"

[project]
name = "amanuensis"
version = "0.1.0"
description = "Deterministic, format-agnostic musical Intermediate Representation with strict validation and invariant harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "mido>=1.3.0",
    "pydantic>=2.6.0",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
gui = [
    "dearpygui>=1.11.1",
    "weasyprint>=62.0",
    "verovio>=6.1.0",
    "cairosvg>=2.9.0",
    "markdown>=3.7",
]
lint = [
    "black>=26.3.1",
    "ruff>=0.14.10",
]
audio-analysis = [
    "librosa>=0.10",
]

[project.scripts]
amanuensis = "amanuensis.main:main"
amanuensis-gui = "amanuensis.gui.app:main"

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.150.2",
    "mutmut>=3.4.0",
    "pyrefly>=0.59.1",
    "pytest>=9.0.2",
]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src", "tests"]
search-path = ["src", ".", "typings"]
permissive-ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "mutation: marks tests in the mutation-testing suite",
    "performance: marks opt-in performance validation tests",
    "slow: marks tests that are slow (e.g. audio analysis with model loading)",
]

[tool.pyright]
stubPath = "typings"
