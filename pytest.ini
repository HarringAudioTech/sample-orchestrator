[pytest]
# Configure pytest behavior for the project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add markers for different test types if needed
markers =
    integration: marks tests as integration tests
    ui: marks tests that test the UI

# Set logging level during tests
log_cli = True
log_cli_level = INFO

# Disable warnings that might clutter test output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Add verbose output by default
addopts = -v